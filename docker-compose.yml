version: "3.8"

services:
  # ------------------------------------------------------------------
  # 1. REVERSE PROXY (Nginx)
  # ------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: dagsf_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - directus
    networks:
      - dagsf_net

  # ------------------------------------------------------------------
  # 2. BACKEND API (Node.js / Express)
  # ------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dagsf_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - dagsf_net

  # ------------------------------------------------------------------
  # 3. POSTGRESQL (Datos transaccionales)
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: dagsf_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dagsf_net

  # ------------------------------------------------------------------
  # 4. REDIS (Cache, sesiones, pub/sub)
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: dagsf_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - dagsf_net

  # ------------------------------------------------------------------
  # 5. MINIO (Archivos, expedientes, contratos)
  # ------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: dagsf_minio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - dagsf_net

  # ------------------------------------------------------------------
  # 6. DIRECTUS (Panel admin interno sobre PostgreSQL)
  # ------------------------------------------------------------------
  directus:
    image: directus/directus:latest
    container_name: dagsf_directus
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CACHE_ENABLED: "true"
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      WEBSOCKETS_ENABLED: "true"
    ports:
      - "8055:8055"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - dagsf_net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  dagsf_net:
    driver: bridge
