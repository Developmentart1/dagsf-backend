events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Gzip
  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript text/xml;

  # Rate limiting basico (protege al backend, no a los estaticos)
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

  # ------------------------------------------------------------------
  # FRONTEND (HTML estatico desde /frontend)
  # ------------------------------------------------------------------
  server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Paginas
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Assets estaticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      expires 1h;
      add_header Cache-Control "public";
    }

    # ------------------------------------------------------------------
    # BACKEND API
    # proxy_pass SIN slash final: preserva /api/... hacia Express
    # (con slash final Nginx removeria /api y las rutas /api/clientes
    #  responderian 404).
    # ------------------------------------------------------------------
    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://backend:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # El backend ya responde CORS via el middleware cors().
      # No duplicar cabeceras ACAO aqui: "*" + credentials es invalido.
      if ($request_method = OPTIONS) {
        return 204;
      }
    }

    # ------------------------------------------------------------------
    # DIRECTUS (panel admin interno)
    # ------------------------------------------------------------------
    location /admin/ {
      proxy_pass http://directus:8055/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
